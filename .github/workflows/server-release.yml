name: Server release

# Reusable: build the app's exact-commit ARM64 image(s), push them to GHCR, and
# release them on the shared EC2 host with server/release.py. Callers pin this
# workflow by commit and pass the same commit as `tools_ref`:
#
#   jobs:
#     release:
#       needs: test
#       if: github.ref == 'refs/heads/main'
#       permissions: { contents: read, packages: write }
#       uses: jimgreco/release-tools/.github/workflows/server-release.yml@<sha>
#       with: { tools_ref: <sha> }
#       secrets:
#         EC2_HOST: ${{ secrets.EC2_HOST }}
#         EC2_USER: ${{ secrets.EC2_USER }}
#         EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
#         EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
#
# The manifest format is documented in server/README.md.

on:
  workflow_call:
    inputs:
      tools_ref:
        description: Full commit of jimgreco/release-tools; must equal the @ref this workflow is pinned to
        type: string
        required: true
      manifest:
        description: Path of the app's server release manifest
        type: string
        default: .github/release/server.json
      deploy:
        description: Release on the host after publishing (false = publish images only)
        type: boolean
        default: true
      environment:
        description: GitHub environment that guards the host release
        type: string
        default: production
    # Optional so apps that keep these in the `production` environment work:
    # the release job runs in that environment, whose secrets take precedence
    # over passed ones. The release job fails closed if any is still empty.
    secrets:
      EC2_HOST:
        required: false
      EC2_USER:
        required: false
      EC2_SSH_KEY:
        required: false
      EC2_SSH_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
      app: ${{ steps.plan.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate manifest and list images
        id: plan
        env:
          MANIFEST: ${{ inputs.manifest }}
          TOOLS_REF: ${{ inputs.tools_ref }}
        run: |
          set -euo pipefail
          [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::tools_ref must be a full release-tools commit'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Unexpected commit SHA'; exit 1; }
          python3 - <<'PY'
          import json, os, re
          manifest = json.load(open(os.environ["MANIFEST"]))
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          expected = "ghcr.io/" + repo
          if manifest.get("image") != expected:
              raise SystemExit("::error::manifest image must be " + expected)
          images = manifest.get("images")
          if not isinstance(images, list) or not images:
              raise SystemExit("::error::manifest needs an images list")
          suffixes = [image.get("tag_suffix", "") for image in images]
          if len(set(suffixes)) != len(suffixes):
              raise SystemExit("::error::image tag_suffix values must be unique")
          for name, service in manifest.get("services", {}).items():
              if service.get("tag_suffix", "") not in suffixes:
                  raise SystemExit("::error::service {} references an unknown image".format(name))
          sha = os.environ["GITHUB_SHA"]
          plan = []
          for image in images:
              suffix = image.get("tag_suffix", "")
              args = {k: str(v).replace("{sha7}", sha[:7]).replace("{sha}", sha)
                      for k, v in image.get("build_args", {}).items()}
              plan.append({
                  "id": suffix or "app",
                  "tag": "{}:{}{}".format(expected, sha, "-" + suffix if suffix else ""),
                  "context": image.get("context", "."),
                  "dockerfile": image.get("dockerfile", os.path.join(image.get("context", "."), "Dockerfile")),
                  "target": image.get("target", ""),
                  "prebuild": image.get("prebuild", ""),
                  "build_args": "\n".join("{}={}".format(k, v) for k, v in args.items()),
              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("images=" + json.dumps(plan) + "\n")
              out.write("app=" + manifest["app"] + "\n")
          PY

  publish:
    name: Publish ${{ matrix.id }} image
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare build context
        if: matrix.prebuild != ''
        env:
          PREBUILD: ${{ matrix.prebuild }}
        run: bash -euo pipefail -c "$PREBUILD"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.app }}-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.app }}-${{ matrix.id }}

  release:
    name: Release on shared host
    if: inputs.deploy
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: server-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: jimgreco/release-tools
          ref: ${{ inputs.tools_ref }}
          path: .release-tools
          persist-credentials: false

      - name: Resolve live build and refuse to move production backwards
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request
          public = json.load(open(os.environ["MANIFEST"])).get("public")
          if not public:
              print("No public endpoint in the manifest; skipping live-build checks.")
              raise SystemExit(0)
          def read():
              request = urllib.request.Request(public["url"], headers={"User-Agent": "release-tools"})
              with urllib.request.urlopen(request, timeout=10) as response:
                  value = json.load(response)
              for part in public.get("field", "build").split("."):
                  value = value.get(part) if isinstance(value, dict) else None
              return value if isinstance(value, str) else ""
          live = ""
          for _ in range(5):
              try:
                  live = read(); break
              except Exception:
                  time.sleep(3)
          sha = os.environ["GITHUB_SHA"]
          print("Live build:", live or "(unreadable)")
          if public.get("refuse_backwards"):
              if len(live) < 7:
                  raise SystemExit("::error::Could not read the live build; refusing to deploy blind")
              full = subprocess.run(["git", "rev-parse", "--verify", "--quiet", live + "^{commit}"],
                                    capture_output=True, text=True).stdout.strip()
              if not full:
                  raise SystemExit("::error::Live build {} is not a commit in this repository".format(live))
              if subprocess.run(["git", "merge-base", "--is-ancestor", full, sha]).returncode:
                  raise SystemExit("::error::Live build {} is not an ancestor of {}; reconcile first".format(full, sha))
              subprocess.run(["git", "log", "--oneline", full + ".." + sha])
          PY

      - name: Prepare pinned SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_SSH_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Missing production secret $name"; exit 1; }
          done
          umask 077
          dir="$RUNNER_TEMP/release-ssh"
          mkdir -p "$dir"
          printf '%s\n' "$EC2_SSH_KEY" > "$dir/key"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null 2>&1 || { echo '::error::EC2_SSH_KEY is not an unencrypted private key'; exit 1; }
          {
            echo 'Host production'
            echo "  HostName $EC2_HOST"
            echo "  User $EC2_USER"
            echo "  IdentityFile $dir/key"
            echo '  IdentitiesOnly yes'
            echo "  UserKnownHostsFile $dir/known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
            echo '  ConnectTimeout 30'
          } > "$dir/config"
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"

      - name: Release on the host
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          manifest_b64="$(python3 -c 'import base64,json,os,sys; print(base64.b64encode(json.dumps(json.load(open(os.environ["MANIFEST"]))).encode()).decode())')"
          [[ "$manifest_b64" =~ ^[A-Za-z0-9+/=]+$ ]]
          # Both values are validated characters only; release.py arrives on stdin.
          # shellcheck disable=SC2029
          ssh -F "$SSH_CONFIG" production "python3 - --sha '$GITHUB_SHA' --manifest-b64 '$manifest_b64'" < .release-tools/server/release.py

      - name: Verify public endpoint reports this build
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          public = json.load(open(os.environ["MANIFEST"])).get("public")
          if not public:
              print("No public endpoint in the manifest; host health checks were the gate.")
              raise SystemExit(0)
          sha = os.environ["GITHUB_SHA"]
          expected = sha[:int(public.get("length", 40))]
          for _ in range(30):
              try:
                  request = urllib.request.Request(public["url"], headers={"User-Agent": "release-tools"})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      value = json.load(response)
                  for part in public.get("field", "build").split("."):
                      value = value.get(part) if isinstance(value, dict) else None
                  if value == expected:
                      print("{} reports {}".format(public["url"], value))
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception:
                  pass
              time.sleep(5)
          raise SystemExit("::error::{} did not report {}".format(public["url"], expected))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-ssh"
